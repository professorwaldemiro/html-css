<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela mista</title>
    <link rel="shortcut icon" href="favicon.ico.png" type="image/x-icon">
    <style>
        table {
            border-collapse: collapse;
            width: 500px;
        }
        th, td {
            border: 1px solid black;
            padding: 10px;
        }
        thead > tr > th {
            background-color: lightgray;
        }

        .cor {
            background-color: lightgray;
        }

    </style>
</head>
<body>
    <h1>Tabela boletim escolar</h1>
    <table>
        <caption>Boletim escolar</caption>
        <thead>
            <tr>
                <th scope="colgroup">Área</th>
                <th scope="colgroup">Disciplina</th>
                <th colspan="2" scope="colgroup">Notas</th>
                <th scope="colgroup">Média</th>
            </tr>
        </thead>
        <tbody>
            
            <tr>
                <th rowspan="4" scope="rowgroup">Exatas</th>
                <td>Matemática</td>
                <td>8.0</td>
                <td>4.0</td>
                <td>6.0</td>
            </tr>
            <tr>
                <td>Física</td>
                <td>7.0</td>
                <td>3.0</td>
                <td>5.0</td>
            </tr>
            <tr>
                <td>Química</td>
                <td>6.0</td>
                <td>2.0</td>
                <td>4.0</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td>9.0</td>
                <td>7.0</td>
                <td>8.0</td>
            </tr>
            <tr>
                <td colspan="4" class="cor">Média de exatas</td>
                <td class="cor">5.3</td>
            </tr>
            <tr>
                <th rowspan="2" scope="rowgroup">Humanas</th>
                <td>História</td>
                <td>8.0</td>
                <td>8.0</td>
                <td>8.0</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td>4.0</td>
                <td>6.0</td>
                <td>5.0</td>
            </tr>
            <tr>
                <td colspan="4" class="cor">Média de humanas</td>
                <td class="cor">6.5</td>
            </tr>

        </tbody>
    </table>
    
</body>
</html>
