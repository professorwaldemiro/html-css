<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <STyle>
        div.container {
            background-color: brown;
            display: flex;
            flex-flow: nowrap;

        }
        div.item {
            background-color: aqua;
            border: 2px solid black ;
            text-align: center;
            flex: auto;
        }
    </STyle>
</head>
<body>
    <div class="container">
        <div class="item">Exemplos de blocos A</div>
        <div class="item">Exemplos de blocos B</div>
        <div class="item">Exemplos de blocos C</div>
        <div class="item">Exemplos de blocos D</div>
        <div class="item">Exemplos de blocos E</div>
        <div class="item">Exemplos de blocos F</div>
        <div class="item">Exemplos de blocos G</div>

    </div>
</body>
</html>
