<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <STyle>
        div.container {
            background-color: brown;
            display: flex;
            flex-flow: wrap;
            height: 400px;
            align-items: flex-start;

        }
        div.item {
            background-color: aqua;
            border: 2px solid black ;
            text-align: center;
            padding: 20px;
            
        }

        div#i1 {
           align-self: stretch;
        }

        div#i2 {
            align-self: center;
        }
        

        div#i3 {
           align-self: flex-end;
        }
        

        div#i4 {
            align-self: center;
        }
        

        div#i5 {
           align-self: flex-start;
        }
        

        div#i6 {
            align-self: stretch;
        }
        

        div#i7 {
           align-self: center;
        }

    </STyle>
</head>
<body>
    <div class="container">
        <div class="item" id="i1">A</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">C</div>
        <div class="item" id="i4">D</div>
        <div class="item" id="i5">E</div>
        <div class="item" id="i6">F</div>
        <div class="item" id="i7">G</div>

    </div>
</body>
</html>
