<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <link rel="shortcut icon" href="favicon.ico.png" type="image/x-icon">

    <style>
        body {
            background-color: aliceblue;
        }
        table {
            border-collapse: collapse;
            width: 500px;
        }

        th, td {
            border: 1px solid black;
            padding: 5px;
        }

        .cnome {
            background-color: aqua;
        }
        .cidade {
            background-color: cadetblue;
        }
        

    </style>
</head>
<body>
    <h1>Exercícios com tabelas</h1>
    <table>
        <colgroup>
        <col class="cnome">
        <col class="csexo">
        <col class="cidade" span="2">
        <col class="cprofissão">
        </colgroup>

        <caption>Cadastro</caption>
        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>
        <tr>
            <td>Pablo</td>
            <td>M</td>
            <td>35</td>
            <td>Professor</td>
        </tr>
           <tr>
            <td>Ane</td>
            <td>F</td>
            <td>74</td>
            <td>Enfermeira</td>
        </tr>
          <tr>
            <td>José</td>
            <td>M</td>
            <td>67</td>
            <td>Padeiro</td>
        </tr>
          <tr>
            <td>Romeu</td>
            <td>M</td>
            <td>52</td>
            <td>Barbeiro</td>
        </tr>
          <tr>
            <td>Perla</td>
            <td>f</td>
            <td>47</td>
            <td>Dentista</td>
        </tr>
          <tr>
            <td>Átila</td>
            <td>M</td>
            <td>49</td>
            <td>Mecânico</td>
        </tr>
          <tr>
            <td>Cristal</td>
            <td>F</td>
            <td>35</td>
            <td>Professora</td>
        </tr>

    </table>
</body>
</html>
