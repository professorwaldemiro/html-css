<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário 010</title>
    <link rel="shortcut icon" href="favicon.ico.png" type="image/x-icon">
</head>
<body>

    <h1>Continuação de formulário com JavaScript.</h1>
    <form action="cadastro.php" method="get" autocomplete="on">

        <p>
            <label for="iano">Ano de nascimento: </label>
            <input type="number" name="ano" id="iano" oninput="calidade()">
        </p>
        <p>
            <label for="iidade">Sua idade é: </label>
            <output id="iidade">0</output>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>

    </form>

    <script>
        function calidade() {
            let atual = new Date().getFullYear()
            iidade.innerHTML = Number(atual) - Number(iano.value)
        }
    </script>
    
</body>
</html>
