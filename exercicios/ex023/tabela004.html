<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela 004</title>
    <link rel="shortcut icon" href="favicon.ico.png" type="image/x-icon">

    <style>
        table {
            width: 500px;
            border-collapse: collapse;

        }

        th, td {
            border: 1px solid black;
        }

    </style>
</head>
<body>
    <h1>Montagem de tabela de filmes</h1>

    <table>
           <caption>Tabela de filmes</caption>
           <thead>
            <tr>
                <th>Grupos</th>
                <th>Nomes</th>
                <th colspan="3">Filmes</th>
            </tr>
           </thead>   
           <tbody>
                <tr>
                   <td rowspan="3">Mulheres</td>
                   <td>Ana Maria Santos</td>
                   <td>Alien</td>
                   <td>Rambo</td>
                   <td>Vingadores</td> 
                </tr>
                <tr>
                    <td>Beatriz Souza</td>
                    <td>Hulk</td>
                    <td>Incepition</td>
                    <td>Batman</td>
                </tr>
           </tbody>
    </table>
</body>

</html>
